services:
  postgres:
    image: postgres:16-alpine
    container_name: qrds-postgres
    environment:
      POSTGRES_DB: qrds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 04012005
    ports:
      - "5432:5432"
    volumes:
      - qrds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qrds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrds_pgdata: