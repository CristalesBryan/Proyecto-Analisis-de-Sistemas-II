spring.datasource.url=jdbc:h2:mem:qrds_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
qrds.login.rate-limit-por-minuto=1000
qrds.registro.rate-limit=1000
qrds.registro.ventana-minutos=10
qrds.consulta.rate-limit-por-minuto=1000
qrds.registro.codigo-prueba=123456
qrds.portal.mantenimiento=false
qrds.archivos.directorio=${java.io.tmpdir}/qrds-test-docs
qrds.documentos.revision-contenido=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB
qrds.reportes.directorio=${java.io.tmpdir}/qrds-test-reportes
qrds.reportes.umbral-filas=5000
qrds.reportes.retencion-horas=24
recaptcha.secret=unused-in-tests
recaptcha.verificar-google=false
