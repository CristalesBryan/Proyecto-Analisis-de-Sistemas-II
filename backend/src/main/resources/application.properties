spring.application.name=qrds-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/qrds
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:04012005}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never

qrds.cors.origins=http://localhost:5173,http://localhost:4200
qrds.portal.mantenimiento=false

qrds.jwt.secret=qrds-municipal-clave-hs256-desarrollo-cambiar-en-produccion-2026
qrds.jwt.expiration-hours=8

qrds.login.max-intentos=5
qrds.login.bloqueo-minutos=15
qrds.login.rate-limit-por-minuto=10

qrds.registro.rate-limit=5
qrds.registro.ventana-minutos=10
qrds.consulta.rate-limit-por-minuto=30
qrds.archivos.directorio=./data/documentos

spring.config.import=optional:file:.env
recaptcha.secret=${RECAPTCHA_SECRET:}
recaptcha.verificar-google=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

resend.api-key=${RESEND_API_KEY:}
resend.from=${MAIL_FROM:}
